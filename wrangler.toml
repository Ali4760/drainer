# wrangler.toml
name = "bsc-usdt-rescue-worker"
compatibility_date = "2024-10-01"

# Bind the D1 database (name defined in Cloudflare dashboard)
[[d1_databases]]
binding = "RESCUE_DB"
# database_id will be added when you create the DB in Cloudflare UI
# database_id = "<YOUR_D1_DATABASE_ID>"

# Workers environment variables (public ones go via Vite, not in this file)
[vars]
BSC_CHAIN_ID = "56"

# Secrets (set via `wrangler secret put`)
# SPONSOR_WALLET_PRIVATE_KEY, BSC_RPC_URL, SPONSOR_BNB_AMOUNT, TELEGRAM_BOT_TOKEN,
# TELEGRAM_CHAT_ID, BSC_USDT_CONTRACT_ADDRESS, RESCUE_DESTINATION_ADDRESS,
# REQUIRED_CONFIRMATIONS

# Routes – assume you will bind worker to same domain as Pages
# (e.g., example.com/api/*) – adjust as needed.
[triggers]
# No triggers needed; worker is invoked via fetch.

# Build configuration – Workers use the src/worker folder
[build]
command = "npm run build:worker"

main = "dist/worker/index.js"
